<style>
  :root {

  * { box-sizing: border-box; }

    width: 100%; font-size: 1rem; padding: 0.7rem 0.9rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237a7168' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");

    margin-bottom: 1.2rem;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
  thead th {
    text-align: left; padding: 0.7rem 0.8rem; font-size: 0.76rem; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--muted); border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th.num { text-align: right; }
  tbody td { padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--border); vertical-align: top; white-space: pre-wrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; white-space: nowrap; }
  tbody td.type, tbody td.category { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
  .count { color: var(--muted); font-size: 0.82rem; margin: 0.6rem 0 1rem; }
  .overflow-wrap { overflow-x: auto; }
</style>
</head>

const select = document.getElementById('songSelect');
const body = document.getElementById('refBody');
const table = document.getElementById('refTable');
const emptyMsg = document.getElementById('emptyMsg');
const countLine = document.getElementById('countLine');

const songs = Object.keys(DATA).sort((a, b) => a.localeCompare(b, 'de'));
for (const s of songs) {
  const opt = document.createElement('option');
  opt.value = s; opt.textContent = s;
  select.appendChild(opt);
}

let currentSort = { key: 'frequency', dir: 'desc' };

function render() {
  const song = select.value;
  const rows = (DATA[song] || []).slice();

  rows.sort((a, b) => {
    let va = a[currentSort.key], vb = b[currentSort.key];
    if (currentSort.key === 'frequency') return currentSort.dir === 'asc' ? va - vb : vb - va;
    va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
    return currentSort.dir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
  });

  body.innerHTML = '';
  if (rows.length === 0) {
    table.style.display = 'none'; emptyMsg.style.display = 'block';
  } else {
    table.style.display = ''; emptyMsg.style.display = 'none';
    for (const r of rows) {
      const tr = document.createElement('tr');
      const tdRef = document.createElement('td'); tdRef.textContent = r.reference; tr.appendChild(tdRef);
      const tdType = document.createElement('td'); tdType.className = 'type'; tdType.textContent = r.type || '\u2014'; tr.appendChild(tdType);
      const tdCat = document.createElement('td'); tdCat.className = 'category'; tdCat.textContent = r.category || '\u2014'; tr.appendChild(tdCat);
      const tdFreq = document.createElement('td'); tdFreq.className = 'num'; tdFreq.textContent = r.frequency; tr.appendChild(tdFreq);
      body.appendChild(tr);
    }
  }
  countLine.textContent = rows.length + (rows.length === 1 ? ' unique reference' : ' unique references');
}

select.addEventListener('change', render);
document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (currentSort.key === key) { currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc'; }
    else { currentSort.key = key; currentSort.dir = key === 'frequency' ? 'desc' : 'asc'; }
    render();
  });
});

if (songs.length > 0) { select.value = songs[0]; render(); }
